<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Price Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #f3e8ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
        }

        .button-container {
            margin-top: 30px;
            text-align: center;
        }

        button {
            width: 100%;
            max-width: 400px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 25px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #15803d;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>House Price Prediction</h1>
    <p class="subtitle">Enter the house details to predict the price</p>

    <form action="/predict" method="POST">

        <div class="form-grid">

            <!-- Bedrooms -->
            <div class="form-group">
                <label for="bedrooms">Bedrooms</label>
                <input type="number" id="bedrooms" name="bedrooms"
                       placeholder="Enter bedrooms" min="0" step="1" required>
            </div>

            <!-- Bathrooms -->
            <div class="form-group">
                <label for="bathrooms">Bathrooms</label>
                <input type="number" id="bathrooms" name="bathrooms"
                       placeholder="Enter bathrooms" min="0" step="0.5" required>
            </div>

            <!-- Sqft Living -->
            <div class="form-group">
                <label for="sqft_living">Sqft Living</label>
                <input type="number" id="sqft_living" name="sqft_living"
                       placeholder="Enter living area" min="0" required>
            </div>

            <!-- Sqft Lot -->
            <div class="form-group">
                <label for="sqft_lot">Sqft Lot</label>
                <input type="number" id="sqft_lot" name="sqft_lot"
                       placeholder="Enter lot area" min="0" required>
            </div>

            <!-- Floors -->
            <div class="form-group">
                <label for="floors">Floors</label>
                <input type="number" id="floors" name="floors"
                       placeholder="Enter floors" min="0" step="0.5" required>
            </div>

            <!-- Waterfront -->
            <div class="form-group">
                <label for="waterfront">Waterfront</label>
                <select id="waterfront" name="waterfront" required>
                    <option value="">Select</option>
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <!-- View -->
            <div class="form-group">
                <label for="view">View</label>
                <input type="number" id="view" name="view"
                       placeholder="Enter view value" min="0" required>
            </div>

            <!-- Condition -->
            <div class="form-group">
                <label for="condition">Condition</label>
                <input type="number" id="condition" name="condition"
                       placeholder="Enter condition (1-5)" min="1" max="5" required>
            </div>

            <!-- Grade -->
            <div class="form-group">
                <label for="grade">Grade</label>
                <input type="number" id="grade" name="grade"
                       placeholder="Enter grade" min="1" required>
            </div>

            <!-- Sqft Above -->
            <div class="form-group">
                <label for="sqft_above">Sqft Above</label>
                <input type="number" id="sqft_above" name="sqft_above"
                       placeholder="Enter sqft above" min="0" required>
            </div>

            <!-- Sqft Basement -->
            <div class="form-group">
                <label for="sqft_basement">Sqft Basement</label>
                <input type="number" id="sqft_basement" name="sqft_basement"
                       placeholder="Enter sqft basement" min="0" required>
            </div>

            <!-- Year Built -->
            <div class="form-group">
                <label for="yr_built">Year Built</label>
                <input type="number" id="yr_built" name="yr_built"
                       placeholder="Enter year built" min="1800" max="2026" required>
            </div>

            <!-- Year Renovated -->
            <div class="form-group">
                <label for="yr_renovated">Year Renovated</label>
                <input type="number" id="yr_renovated" name="yr_renovated"
                       placeholder="Enter year renovated" min="0" max="2026" required>
            </div>

            <!-- City -->
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city"
                       placeholder="Enter city" required>
            </div>

            <!-- Year -->
            <div class="form-group">
                <label for="year">Year</label>
                <input type="number" id="year" name="year"
                       placeholder="Enter year" min="1900" max="2026" required>
            </div>

            <!-- Month -->
            <div class="form-group">
                <label for="month">Month</label>
                <input type="number" id="month" name="month"
                       placeholder="Enter month (1-12)" min="1" max="12" required>
            </div>

            <!-- Day -->
            <div class="form-group">
                <label for="day">Day</label>
                <input type="number" id="day" name="day"
                       placeholder="Enter day (1-31)" min="1" max="31" required>
            </div>

        </div>

        <!-- Submit Button -->
        <div class="button-container">
            <button type="submit">House Prediction</button>
        </div>

    </form>

</div>

</body>
</html>
